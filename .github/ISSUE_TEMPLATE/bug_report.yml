name: Bug report
description: Report a launcher problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Zapuskalka launcher problem.
        Do not include security-sensitive information. Use Private Vulnerability Reporting for vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zapuskalka version
      placeholder: "0.5.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15.5, Fedora 43, …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove tokens, credentials, email addresses, and other sensitive data first.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I checked that this is not a publicly disclosed security vulnerability.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
